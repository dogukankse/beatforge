<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <!-- Fills the phone screen, no pinch zoom, draws under the notch. -->
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0b14">
  <title>beatforge-app</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; height: 100%; background: #0d0b14; color: #eef0f7;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%;
    }
    #unity-container {
      position: fixed; inset: 0;
      /* dvh keeps the canvas correct while mobile browser chrome slides away */
      height: 100dvh; width: 100vw;
      display: flex; align-items: center; justify-content: center;
    }
    #unity-canvas {
      width: 100%; height: 100%; display: block; background: #0d0b14;
      touch-action: none; -webkit-tap-highlight-color: transparent; outline: none;
    }
    /*
      The game is portrait: a 30/70 vertical split. A phone fills the screen,
      but anything wider than 3:4 (desktop, or a phone turned sideways) gets a
      centred portrait canvas instead of a stretched one - Unity's screen size
      is this element's size, so this is what keeps the layout correct.
    */
    @media (min-aspect-ratio: 3/4) {
      #unity-canvas {
        height: 100dvh;
        width: min(100vw, calc(100dvh * 9 / 16));
        box-shadow: 0 0 60px rgba(0, 0, 0, .6);
      }
    }
    #unity-loading {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #0d0b14; transition: opacity .35s ease;
    }
    #unity-loading.done { opacity: 0; pointer-events: none; }
    #unity-title { font-size: clamp(22px, 7vw, 44px); font-weight: 700; letter-spacing: .12em; }
    #unity-bar { width: min(62vw, 320px); height: 8px; border-radius: 99px; background: #241f38; overflow: hidden; }
    #unity-bar-fill { width: 0; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #5ad0ff, #6ef0a0); transition: width .15s ease; }
    #unity-hint { font-size: 14px; opacity: .55; }
    #unity-warning {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px;
      font-size: 13px; background: #3a1420; color: #ffd9d9; display: none;
    }
    /* The playfield is a vertical 30/70 split, so ask for portrait. */
    #rotate-hint { position: absolute; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; background: #0d0b14; z-index: 5; }
    #rotate-hint span { font-size: 18px; opacity: .8; }
    @media (max-width: 900px) and (orientation: landscape) {
      #rotate-hint { display: flex; }
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="unity-loading">
      <div id="unity-title">beatforge-app</div>
      <div id="unity-bar"><div id="unity-bar-fill"></div></div>
      <div id="unity-hint">loading…</div>
    </div>
    <div id="rotate-hint"><span>↻</span><span>Rotate your device to portrait</span></div>
    <div id="unity-warning"></div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var fill = document.querySelector("#unity-bar-fill");
    var hint = document.querySelector("#unity-hint");

    // No pull-to-refresh, no double-tap zoom, no long-press menu over the game.
    document.addEventListener("touchmove", function (event) { event.preventDefault(); }, { passive: false });
    document.addEventListener("gesturestart", function (event) { event.preventDefault(); });
    canvas.addEventListener("contextmenu", function (event) { event.preventDefault(); });

    function unityShowBanner(message, type) {
      var banner = document.querySelector("#unity-warning");
      banner.style.display = "block";
      banner.innerHTML = message;
      if (type !== "error") setTimeout(function () { banner.style.display = "none"; }, 5000);
    }

    var config = {
      arguments: [],
      dataUrl: "Build/WebGLPublish.data.unityweb",
      frameworkUrl: "Build/WebGLPublish.framework.js.unityweb",
      codeUrl: "Build/WebGLPublish.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "beatforge-app",
      productVersion: "1.0",
      showBanner: unityShowBanner,
      // A phone does not need 3x pixels for this art style; capping keeps the
      // frame rate up, which matters more than sharpness in a rhythm game.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };
  </script>
  <script src="Build/WebGLPublish.loader.js"></script>
  <script>
    createUnityInstance(canvas, config, function (progress) {
      fill.style.width = (progress * 100) + "%";
      hint.textContent = progress < 1 ? "loading… " + Math.round(progress * 100) + "%" : "starting…";
    }).then(function (instance) {
      loading.classList.add("done");
      setTimeout(function () { loading.style.display = "none"; }, 400);
      window.unityInstance = instance;
    }).catch(function (message) {
      hint.textContent = "";
      unityShowBanner(message, "error");
    });
  </script>
</body>
</html>
